<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ca-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2029" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>
    <linearGradient id="ca-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AB978C" />
      <stop offset="100%" stop-color="#6B7C98" />
    </linearGradient>
  </defs>

  <!-- Contenedor base de la aplicación (Urban Slate) -->
  <rect width="60" height="60" x="2" y="2" rx="14" fill="url(#ca-bg)" stroke="url(#ca-border)" stroke-width="3" />

  <!-- Glifo de corchete izquierdo < en Sandstone Bronze -->
  <path d="M21 21L11 32L21 43" stroke="#AB978C" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Barra divisoria central / en Pristine White -->
  <path d="M36 18L28 46" stroke="#E9E6E7" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Glifo de corchete derecho > en Slate Blue -->
  <path d="M43 21L53 32L43 43" stroke="#6B7C98" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
